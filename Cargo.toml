[workspace]
members = [
    "crates/disksieve-core",
    "crates/disksieve-cli",
    "src-tauri",
]
resolver = "2"

# Shared metadata — crates inherit it with `field.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/DiskSieve/disksieve"
homepage = "https://github.com/DiskSieve/disksieve"
authors = ["DiskSieve Contributors"]

# Single source of truth for dependency versions across the workspace.
[workspace.dependencies]
disksieve-core = { path = "crates/disksieve-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Small, fast release binaries (KPI: installer < 12 MB).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "unwind"
