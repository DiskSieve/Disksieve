name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR/branch cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: ${{ matrix.os }}
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (WebKitGTK for Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      # Frontend first: `tauri::generate_context!` requires `frontendDist` (../dist) to exist.
      - name: npm ci
        run: npm ci
      - name: Frontend build (tsc + vite)
        run: npm run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # `cargo test` re-exports ts-rs bindings. A content diff or a new untracked file
      # means src/types/generated is stale.
      - name: ts-rs bindings are up to date
        run: |
          untracked="$(git ls-files --others --exclude-standard -- src/types/generated)"
          if ! git diff --exit-code -- src/types/generated || [ -n "$untracked" ]; then
            [ -n "$untracked" ] && printf 'Untracked bindings:\n%s\n' "$untracked"
            echo "::error::src/types/generated is out of date. Run 'npm run gen:types' and commit the result."
            exit 1
          fi
